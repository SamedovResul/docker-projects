name: First CI

on:
  push:
    branches:
     - main

permissions:
  contents: read
  packages: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Get repository files
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20


      - name: install dependencies
        working-directory: src
        run: npm ci

      - name: Run tests
        working-directory: src
        run: npm test
      
      - name: Build Docker image
        run: docker build --tag api-node:test --file Dockerfile .

      - name: Start app container
        run: docker run -detach --name api-under-test --publish 3000:3000 api-node:test
      
      - name: Check app responds
        run: | 
          for attempt in {1..10}; do
            if curl --fail --silent  http://localhost:3000/; then
              exit 0
            fi
            sleep 2
          done
          docker logs api-under-test
          exit 1

      - name: Clean up app container
        if: always()
        run: docker rm --force api-under-test || true

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with: 
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{secrets.GHCR_PAT}}      

      - name: Tag and push images
        run: | 
          OWNER=$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          VERSION=$(node -p "require('./src/package.json').version")
          IMAGE="ghcr.io/${OWNER}/api-node"

          docker tag api-node:test "${IMAGE}:${GITHUB_SHA}"
          docker tag api-node:test "${IMAGE}:${VERSION}"

          docker push "${IMAGE}:${GITHUB_SHA}"
          docker push "${IMAGE}:${VERSION}"
# 
      - name: Scan image for critical vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: api-node:test
          format: table
          exit-code: '1'
          severity: CRITICAL