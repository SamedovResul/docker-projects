name: First CI

on:
  push:
    branches:
     - main

permissions:
  contents: read
  packages: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Get repository files
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20


      - name: install dependencies
        working-directory: src
        run: npm ci

      - name: Run tests
        working-directory: src
        run: npm test
      
      - name: Build Docker image
        run: docker build --tag api-node:test --file Dockerfile .

      - name: Start app container
        run: docker run -detach --name api-under-test --publish 3000:3000 api-node:test
      
      - name: Check app responds
        run: | 
          for attempt in {1..10}; do
            if curl --fail --silent  http://localhost:3000/; then
              exit 0
            fi
            sleep 2
          done
          docker logs api-under-test
          exit 1

      - name: Clean up app container
        if: always()
        run: docker rm --force api-under-test || true